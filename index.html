    <style>
      :root {
        --bg-page: #FAF8F5;
        --bg-card: #FFFFFF;
        --bg-soft: #F3EFE8;
        --text-main: #1A1A1A;
        --text-muted: #4A4640;
        --border-subtle: #D8D0C5;
        --border-strong: #9E9589;
        --green-primary: #1B6B3A;
        --green-primary-hover: #14532D;
        --green-soft: #E5F4EA;
        --green-border: #1B6B3A;
        --green-text: #0F3D21;
        --coral-soft: #FDECE8;
        --coral-border: #C2412D;
        --coral-text: #6E1E12;
        --blue-voice: #E8F0FA;
        --blue-voice-hover: #D6E4F7;
        --blue-voice-border: #2B5B9E;
        --blue-voice-text: #153666;
        --focus-ring: #1E4E8C;
        --radius-card: 20px;
        --radius-btn: 16px;
        --gap-btn: 16px;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-page);
        color: var(--text-main);
        font-family: "PT Sans", "Nunito", "Segoe UI", "Verdana", system-ui, -apple-system, sans-serif;
        font-size: 22px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px 16px 40px;
      }

      .app-container {
        width: 100%;
        max-width: 480px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .card {
        background-color: var(--bg-card);
        border: 1.5px solid var(--border-subtle);
        border-radius: var(--radius-card);
        padding: 24px 20px;
        box-shadow: 0 4px 16px rgba(26, 26, 26, 0.05);
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      h1,
      h2 {
        margin: 0;
        font-size: 28px;
        line-height: 1.35;
        font-weight: 700;
        color: var(--text-main);
        text-wrap: balance;
      }

      p {
        margin: 0;
        font-size: 22px;
        line-height: 1.5;
        color: var(--text-main);
      }

      .text-muted {
        color: var(--text-muted);
      }

      .meta-line {
        font-size: 20px;
        line-height: 1.4;
        color: var(--text-muted);
        font-weight: 600;
      }

      .divider {
        height: 1px;
        background-color: var(--border-subtle);
        border: 0;
        margin: 0;
        width: 100%;
      }

      /* Все кнопки: минимум 68px высота, 16px скругление, 16px отступ */
      button {
        font-family: inherit;
        font-size: 22px;
        line-height: 1.35;
        font-weight: 700;
        min-height: 68px;
        border-radius: var(--radius-btn);
        padding: 16px 20px;
        cursor: pointer;
        border: 2px solid transparent;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        text-align: center;
        width: 100%;
        color: var(--text-main);
        background-color: var(--bg-card);
        transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.12s ease;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }

      button:focus-visible {
        outline: 4px solid var(--focus-ring);
        outline-offset: 3px;
      }

      button:active:not(:disabled) {
        transform: scale(0.985);
      }

      button:disabled {
        cursor: default;
      }

      .btn-stack {
        display: flex;
        flex-direction: column;
        gap: var(--gap-btn);
        width: 100%;
      }

      .btn-primary {
        background-color: var(--green-primary);
        color: #FFFFFF;
        border-color: var(--green-primary);
      }

      .btn-primary:hover:not(:disabled) {
        background-color: var(--green-primary-hover);
        border-color: var(--green-primary-hover);
      }

      .btn-secondary {
        background-color: var(--bg-soft);
        color: var(--text-main);
        border-color: var(--border-strong);
      }

      .btn-secondary:hover:not(:disabled) {
        background-color: #E8E1D6;
      }

      .btn-voice {
        background-color: var(--blue-voice);
        color: var(--blue-voice-text);
        border-color: var(--blue-voice-border);
      }

      .btn-voice:hover:not(:disabled) {
        background-color: var(--blue-voice-hover);
      }

      .btn-option {
        background-color: var(--bg-card);
        color: var(--text-main);
        border: 2px solid var(--border-strong);
        justify-content: flex-start;
        text-align: left;
        padding: 16px 20px;
      }

      .btn-option:hover:not(:disabled) {
        background-color: var(--bg-soft);
        border-color: var(--text-main);
      }

      .btn-option.is-correct,
      .grid-cell.is-correct {
        background-color: var(--green-soft);
        border-color: var(--green-border);
        color: var(--green-text);
      }

      .btn-option.is-wrong,
      .grid-cell.is-wrong {
        background-color: var(--coral-soft);
        border-color: var(--coral-border);
        color: var(--coral-text);
      }

      .btn-option.is-dimmed,
      .grid-cell.is-dimmed {
        opacity: 0.72;
      }

      .option-marker {
        flex-shrink: 0;
        font-weight: 700;
        min-width: 28px;
      }

      /* Прогресс тренировки */
      .progress-header {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .progress-track {
        width: 100%;
        height: 12px;
        background-color: #E5DFD5;
        border-radius: 999px;
        overflow: hidden;
      }

      .progress-fill {
        height: 100%;
        background-color: var(--green-primary);
        border-radius: 999px;
        transition: width 0.25s ease;
      }

      /* Блок серии дней */
      .streak-box {
        background-color: var(--bg-soft);
        border: 1.5px solid var(--border-subtle);
        border-radius: 16px;
        padding: 18px 20px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .streak-number {
        font-size: 28px;
        line-height: 1.3;
        font-weight: 700;
        color: var(--green-primary);
        font-variant-numeric: tabular-nums;
      }

      /* Список категорий на старте */
      .plan-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .plan-item {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 12px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--border-subtle);
      }

      .plan-item:last-child {
        border-bottom: 0;
        padding-bottom: 0;
      }

      /* Сетка внимания 5x5 */
      .attention-grid {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 10px;
        width: 100%;
      }

      .grid-cell {
        min-height: 56px;
        padding: 8px 2px;
        font-family: "PT Sans", "Verdana", "Arial", sans-serif;
        font-size: 26px;
        line-height: 1;
        font-weight: 700;
        border: 2px solid var(--border-strong);
        border-radius: var(--radius-btn);
        background-color: var(--bg-card);
        color: var(--text-main);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .grid-cell:hover:not(:disabled) {
        background-color: var(--bg-soft);
        border-color: var(--text-main);
      }

      /* Карточка английского слова */
      .english-word-box {
        background-color: var(--bg-soft);
        border: 1.5px solid var(--border-subtle);
        border-radius: 16px;
        padding: 20px;
        text-align: center;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .english-word-text {
        font-size: 28px;
        line-height: 1.35;
        font-weight: 700;
        letter-spacing: 0.01em;
        color: var(--text-main);
      }

      /* Панель обратной связи */
      .feedback-box {
        border-radius: 16px;
        padding: 18px 20px;
        border: 2px solid transparent;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .feedback-box.is-correct {
        background-color: var(--green-soft);
        border-color: var(--green-border);
        color: var(--green-text);
      }

      .feedback-box.is-wrong {
        background-color: var(--coral-soft);
        border-color: var(--coral-border);
        color: var(--coral-text);
      }

      .feedback-title {
        font-size: 24px;
        line-height: 1.35;
        font-weight: 700;
        color: inherit;
      }

      .feedback-note {
        font-size: 22px;
        line-height: 1.5;
        color: var(--text-main);
      }

      .celebration-banner {
        background-color: var(--green-soft);
        border: 2px solid var(--green-border);
        border-radius: 16px;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .celebration-banner h2 {
        color: var(--green-text);
      }

      .icon-svg {
        width: 26px;
        height: 26px;
        flex-shrink: 0;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      /* Праздничное конфетти на финальном экране */
      .confetti-layer {
        position: fixed;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        z-index: 50;
      }

      .confetti-piece {
        position: absolute;
        top: -24px;
        width: 12px;
        height: 18px;
        border-radius: 3px;
        opacity: 0;
        will-change: transform, opacity;
        animation: confetti-fall var(--dur, 4s) cubic-bezier(0.25, 0.46, 0.45, 0.94) var(--delay, 0s) forwards;
      }

      @keyframes confetti-fall {
        0% {
          opacity: 0;
          transform: translate3d(0, 0, 0) rotate(0deg);
        }
        10% {
          opacity: 0.95;
        }
        85% {
          opacity: 0.9;
        }
        100% {
          opacity: 0;
          transform: translate3d(var(--drift, 30px), 106vh, 0) rotate(var(--rot, 540deg));
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition: none !important;
          animation: none !important;
        }

        .confetti-layer {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="app-container" id="app" aria-live="polite"></main>

    <script>
      (function () {
        "use strict";

        // ============================================================
        // 1. Утилиты даты и детерминированный генератор (Seeded RNG)
        // ============================================================
        function getLocalDateKey(dateObj) {
          var d = dateObj || new Date();
          var y = d.getFullYear();
          var m = String(d.getMonth() + 1).padStart(2, "0");
          var day = String(d.getDate()).padStart(2, "0");
          return y + "-" + m + "-" + day;
        }

        function getYesterdayKey(dateObj) {
          var d = dateObj ? new Date(dateObj.getTime()) : new Date();
          d.setDate(d.getDate() - 1);
          return getLocalDateKey(d);
        }

        function formatRussianDate(dateObj) {
          var weekdays = [
            "Воскресенье",
            "Понедельник",
            "Вторник",
            "Среда",
            "Четверг",
            "Пятница",
            "Суббота"
          ];
          var months = [
            "января",
            "февраля",
            "марта",
            "апреля",
            "мая",
            "июня",
            "июля",
            "августа",
            "сентября",
            "октября",
            "ноября",
            "декабря"
          ];
          return weekdays[dateObj.getDay()] + ", " + dateObj.getDate() + " " + months[dateObj.getMonth()];
        }

        function getGreeting(dateObj) {
          var hour = dateObj.getHours();
          if (hour >= 5 && hour < 12) return "Доброе утро!";
          if (hour >= 12 && hour < 18) return "Добрый день!";
          if (hour >= 18 && hour < 23) return "Добрый вечер!";
          return "Доброй ночи!";
        }

        function pluralizeRu(n, one, few, many) {
          var mod100 = Math.abs(n) % 100;
          var mod10 = Math.abs(n) % 10;
          if (mod100 >= 11 && mod100 <= 14) return many;
          if (mod10 === 1) return one;
          if (mod10 >= 2 && mod10 <= 4) return few;
          return many;
        }

        function pluralizeDays(n) {
          return pluralizeRu(n, "день", "дня", "дней");
        }

        function hashString(str) {
          var h = 2166136261;
          for (var i = 0; i < str.length; i++) {
            h ^= str.charCodeAt(i);
            h = Math.imul(h, 16777619);
          }
          return h >>> 0;
        }

        function createSeededRng(seedStr) {
          var state = hashString(seedStr) || 1;
          return function nextRandom() {
            state = (state + 0x6D2B79F5) >>> 0;
            var t = Math.imul(state ^ (state >>> 15), 1 | state);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }

        function randInt(rng, min, max) {
          return Math.floor(rng() * (max - min + 1)) + min;
        }

        function shuffleArray(rng, arr) {
          var copy = arr.slice();
          for (var i = copy.length - 1; i > 0; i--) {
            var j = Math.floor(rng() * (i + 1));
            var tmp = copy[i];
            copy[i] = copy[j];
            copy[j] = tmp;
          }
          return copy;
        }

        // ============================================================
        // 2. Хранилище прогресса (localStorage)
        // ============================================================
        var STORAGE_KEY = "zaryadka_uma_streak_v1";

        function loadProgress() {
          try {
            var raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) return { streak: 0, lastCompletedDate: null };
            var parsed = JSON.parse(raw);
            return {
              streak: typeof parsed.streak === "number" && parsed.streak >= 0 ? parsed.streak : 0,
              lastCompletedDate: typeof parsed.lastCompletedDate === "string" ? parsed.lastCompletedDate : null
            };
          } catch (e) {
            return { streak: 0, lastCompletedDate: null };
          }
        }

        function getActiveStreakInfo() {
          var today = getLocalDateKey();
          var yesterday = getYesterdayKey();
          var progress = loadProgress();
          var completedToday = progress.lastCompletedDate === today;
          var displayStreak = 0;

          if (progress.lastCompletedDate === today || progress.lastCompletedDate === yesterday) {
            displayStreak = progress.streak;
          }

          return {
            streak: displayStreak,
            completedToday: completedToday
          };
        }

        function recordWorkoutCompletion() {
          var today = getLocalDateKey();
          var yesterday = getYesterdayKey();
          var progress = loadProgress();

          if (progress.lastCompletedDate === today) {
            return progress.streak;
          }

          var newStreak = 1;
          if (progress.lastCompletedDate === yesterday) {
            newStreak = progress.streak + 1;
          }

          var next = {
            streak: newStreak,
            lastCompletedDate: today
          };

          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(next));
          } catch (e) {
            // Игнорируем ошибку, если хранилище недоступно
          }

          return newStreak;
        }

        // ============================================================
        // 3. Озвучивание текста (Web Speech API)
        // ============================================================
        var cachedVoices = [];
        var isSpeaking = false;

        function refreshVoices() {
          if (!("speechSynthesis" in window)) return;
          cachedVoices = window.speechSynthesis.getVoices() || [];
        }

        if ("speechSynthesis" in window) {
          refreshVoices();
          if (typeof window.speechSynthesis.addEventListener === "function") {
            window.speechSynthesis.addEventListener("voiceschanged", refreshVoices);
          } else {
            window.speechSynthesis.onvoiceschanged = refreshVoices;
          }
        }

        function findBestVoice(langPrefix) {
          if (!cachedVoices.length) refreshVoices();
          var exact = null;
          var partial = null;
          var targetLower = langPrefix.toLowerCase();
          var shortCode = targetLower.split("-")[0];

          for (var i = 0; i < cachedVoices.length; i++) {
            var v = cachedVoices[i];
            var vLang = (v.lang || "").toLowerCase().replace("_", "-");
            if (vLang === targetLower) {
              exact = v;
              break;
            }
            if (!partial && vLang.indexOf(shortCode) === 0) {
              partial = v;
            }
          }
          return exact || partial;
        }

        function stopSpeech() {
          if ("speechSynthesis" in window) {
            window.speechSynthesis.cancel();
          }
          isSpeaking = false;
        }

        function speakSequence(segments, onDone) {
          if (!("speechSynthesis" in window)) {
            if (onDone) onDone(false);
            return;
          }

          stopSpeech();
          isSpeaking = true;

          var idx = 0;
          function speakNext() {
            if (idx >= segments.length) {
              isSpeaking = false;
              if (onDone) onDone(true);
              return;
            }

            var seg = segments[idx++];
            var utterance = new SpeechSynthesisUtterance(seg.text);
            utterance.lang = seg.lang;
            utterance.rate = seg.lang.indexOf("en") === 0 ? 0.85 : 0.92;
            utterance.pitch = 1.0;

            var voice = findBestVoice(seg.lang);
            if (voice) {
              utterance.voice = voice;
            }

            utterance.onend = function () {
              speakNext();
            };

            utterance.onerror = function () {
              isSpeaking = false;
              if (onDone) onDone(false);
            };

            window.speechSynthesis.speak(utterance);
          }

          speakNext();
        }

        // ============================================================
        // 4. Базы вопросов и генераторы по категориям
        // ============================================================

        // --- Категория 1: Математика (алгоритмическая генерация) ---
        function buildMathDistractors(rng, correct, stepChoices) {
          var candidates = [];
          var offsets = shuffleArray(rng, stepChoices || [-15, -10, -5, 5, 10, 15, 20, -20]);
          for (var i = 0; i < offsets.length; i++) {
            var val = correct + offsets[i];
            if (val > 0 && val !== correct && candidates.indexOf(val) === -1) {
              candidates.push(val);
            }
            if (candidates.length === 2) break;
          }
          while (candidates.length < 2) {
            var fallback = correct + (candidates.length + 1) * 5;
            if (candidates.indexOf(fallback) === -1 && fallback !== correct) {
              candidates.push(fallback);
            }
          }
          return candidates;
        }

        function generateMathQuestions(rng) {
          var templates = [
            // 1. Two-step shopping + change from 500 or 1000 RUB
            function (r) {
              var banknote = randInt(r, 0, 1) === 0 ? 500 : 1000;
              var item1Price = banknote === 500 ? randInt(r, 15, 35) * 10 : randInt(r, 30, 70) * 10;
              var item2Price = banknote === 500 ? randInt(r, 20, 45) * 10 : randInt(r, 40, 90) * 10;
              var item1Qty = randInt(r, 1, 2);
              var item2Qty = 1;
              var totalCost = item1Price * item1Qty + item2Price * item2Qty;
              // Ensure totalCost is less than banknote for realistic change
              if (totalCost >= banknote) {
                item1Price = Math.floor(item1Price / 2);
                item2Price = Math.floor(item2Price / 2);
                totalCost = item1Price * item1Qty + item2Price * item2Qty;
              }
              var ans = banknote - totalCost;
              
              var itemNames = [
                ["пакет молока", "батон хлеба"],
                ["упаковку сыра", "пачку масла"],
                ["бутылку масла", "килограмм сахара"],
                ["коробку конфет", "пачку печенья"]
              ];
              var pair = itemNames[randInt(r, 0, itemNames.length - 1)];
              
              var promptText = "Вы купили " + item1Qty + " шт. (" + pair[0] + ") по " + item1Price + " руб. и " + item2Qty + " шт. (" + pair[1] + ") по " + item2Price + " руб. Сколько сдачи вы получите с " + banknote + " рублей?";
              
              var distractors = buildMathDistractors(r, ans, [-50, -30, -20, -10, 10, 20, 30, 50]);
              return {
                prompt: promptText,
                speechPrompt: promptText,
                correctValue: ans,
                unit: "руб.",
                explanation: "Стоимость покупки: " + item1Price + "*" + item1Qty + " + " + item2Price + "*" + item2Qty + " = " + totalCost + " руб. Сдача: " + banknote + " - " + totalCost + " = " + ans + " руб.",
                stepChoices: distractors
              };
            },
            // 2. Logical number sequences with 5 numbers where the 4th is hidden
            function (r) {
              var start = randInt(r, 2, 15);
              var step = randInt(r, 2, 9);
              var type = randInt(r, 0, 1); // 0 = addition, 1 = subtraction
              var seq = [];
              var current = start;
              for (var i = 0; i < 5; i++) {
                seq.push(current);
                if (type === 0) {
                  current += step;
                } else {
                  current -= step;
                }
              }
              var ans = seq[3];
              var promptText = "Найдите пропущенное число в последовательности: " + seq[0] + ", " + seq[1] + ", " + seq[2] + ", [ ? ], " + seq[4];
              
              var distractors = buildMathDistractors(r, ans, [-step, step, -step*2, step*2, 1, -1]);
              return {
                prompt: promptText,
                speechPrompt: promptText,
                correctValue: ans,
                unit: "",
                explanation: "Закономерность: каждое следующее число " + (type === 0 ? "увеличивается" : "уменьшается") + " на " + step + ". Пропущенное число: " + ans + ".",
                stepChoices: distractors
              };
            },
            // 3. Percentage discounts (10%, 20%, 25% off a pharmacy/grocery price)
            function (r) {
              var discountPercent = [10, 20, 25][randInt(r, 0, 2)];
              var originalPrice = randInt(r, 3, 20) * 100; // 300 to 2000
              var discountAmount = originalPrice * discountPercent / 100;
              var ans = originalPrice - discountAmount;
              
              var items = ["витамины", "тонометр", "средство от кашля", "упаковка таблеток", "мазь для суставов"];
              var item = items[randInt(r, 0, items.length - 1)];
              
              var promptText = "В аптеке скидка " + discountPercent + "% на " + item + ". Старая цена: " + originalPrice + " рублей. Сколько теперь стоит товар?";
              
              var distractors = buildMathDistractors(r, ans, [-100, -50, -20, 20, 50, 100]);
              return {
                prompt: promptText,
                speechPrompt: promptText,
                correctValue: ans,
                unit: "руб.",
                explanation: "Скидка " + discountPercent + "% от " + originalPrice + " = " + discountAmount + " руб. Новая цена: " + originalPrice + " - " + discountAmount + " = " + ans + " руб.",
                stepChoices: distractors
              };
            },
            // 4. Reading book pages with fractions
            function (r) {
              var totalPages = randInt(r, 1, 4) * 40 + 40; // 80, 120, 160, 200
              var fraction = [2, 4, 5][randInt(r, 0, 2)]; // 1/2, 1/4, 1/5
              var day1Pages = totalPages / fraction;
              var day2Pages = randInt(r, 10, 30);
              var ans = totalPages - day1Pages - day2Pages;
              
              if (ans <= 0) {
                day2Pages = 5;
                ans = totalPages - day1Pages - day2Pages;
              }
              
              var promptText = "В книге " + totalPages + " страниц. В первый день вы прочитали 1/" + fraction + " книги, а во второй день — ещё " + day2Pages + " страниц. Сколько страниц осталось прочитать?";
              
              var distractors = buildMathDistractors(r, ans, [-20, -10, 10, 20, 30, -30]);
              return {
                prompt: promptText,
                speechPrompt: promptText,
                correctValue: ans,
                unit: "стр.",
                explanation: "В первый день: " + totalPages + " / " + fraction + " = " + day1Pages + " стр. Осталось: " + totalPages + " - " + day1Pages + " - " + day2Pages + " = " + ans + " стр.",
                stepChoices: distractors
              };
            },
            // 5. Time and schedule calculations crossing the hour mark
            function (r) {
              var startHour = randInt(r, 8, 20);
              var startMinute = [5, 10, 15, 20, 25, 35, 40, 45, 50][randInt(r, 0, 8)];
              var durationHour = randInt(r, 1, 2);
              var durationMinute = [10, 15, 20, 25, 30, 35, 40, 45, 50][randInt(r, 0, 8)];
              
              var totalMinutes = startHour * 60 + startMinute + durationHour * 60 + durationMinute;
              var endHour = Math.floor(totalMinutes / 60) % 24;
              var endMinute = totalMinutes % 60;
              
              var ansStr = (endHour < 10 ? "0" : "") + endHour + ":" + (endMinute < 10 ? "0" : "") + endMinute;
              
              var promptText = "Поезд отправляется в " + (startHour < 10 ? "0" : "") + startHour + ":" + (startMinute < 10 ? "0" : "") + startMinute + ". Время в пути — " + durationHour + " ч " + durationMinute + " мин. Во сколько поезд прибудет на станцию?";
              
              // Custom distractors for time
              var dist1 = (endHour < 10 ? "0" : "") + endHour + ":" + (endMinute < 10 ? "0" : "") + Math.min(59, endMinute + 15);
              var dist2 = (endHour < 10 ? "0" : "") + endHour + ":" + (endMinute < 10 ? "0" : "") + Math.max(0, endMinute - 10);
              // Just in case they are identical
              if (dist1 === ansStr) dist1 = (endHour+1 < 10 ? "0" : "") + (endHour+1) + ":" + (endMinute < 10 ? "0" : "") + endMinute;
              if (dist2 === ansStr) dist2 = (endHour-1 < 10 ? "0" : "") + (endHour-1) + ":" + (endMinute < 10 ? "0" : "") + endMinute;
              
              return {
                prompt: promptText,
                speechPrompt: promptText,
                correctValue: ansStr,
                unit: "",
                isStringValue: true,
                distractors: [dist1, dist2],
                explanation: startHour + "ч " + startMinute + "м + " + durationHour + "ч " + durationMinute + "м = " + endHour + "ч " + endMinute + "м, то есть " + ansStr + ".",
                stepChoices: []
              };
            },
            // 6. Mental addition of 3 utility bills
            function (r) {
              var electricity = randInt(r, 3, 15) * 100 + randInt(r, 0, 9) * 10;
              var water = randInt(r, 2, 10) * 100 + randInt(r, 0, 9) * 10;
              var phone = randInt(r, 3, 8) * 100 + randInt(r, 0, 9) * 10;
              var ans = electricity + water + phone;
              
              var promptText = "Оплатите три квитанции: за электричество — " + electricity + " руб., за воду — " + water + " руб., за телефон — " + phone + " руб. Сколько всего нужно заплатить?";
              
              var distractors = buildMathDistractors(r, ans, [-100, -50, -20, 20, 50, 100]);
              return {
                prompt: promptText,
                speechPrompt: promptText,
                correctValue: ans,
                unit: "руб.",
                explanation: "Сумма: " + electricity + " + " + water + " + " + phone + " = " + ans + " руб.",
                stepChoices: distractors
              };
            }
          ];

          var pickedTemplates = shuffleArray(rng, templates).slice(0, 2);
          return pickedTemplates.map(function (fn) {
            var item = fn(rng);
            
            var optionsList = [];
            if (item.isStringValue) {
              optionsList = [item.correctValue].concat(item.distractors);
            } else {
              var distractors = buildMathDistractors(rng, item.correctValue, item.stepChoices);
              optionsList = [item.correctValue].concat(distractors);
            }
            
            var shuffled = shuffleArray(rng, optionsList);
            var correctIdx = shuffled.indexOf(item.correctValue);

            return {
              type: "choice",
              category: "Математика",
              prompt: item.prompt,
              speechSegments: [{ text: item.speechPrompt, lang: "ru-RU" }],
              options: shuffled.map(function (v) {
                return v + (item.unit ? " " + item.unit : "");
              }),
              correctIndex: correctIdx,
              explanation: item.explanation
            };
          });
        }

        // --- Категория 2: Внимание (сетка 5x5) ---
        var ATTENTION_PAIRS = [
          { base: "Ш", target: "Щ", descBasePlural: "букв «Ш»", descTargetPlural: "букв «Щ»", descBase: "букву «Ш»", descTarget: "букву «Щ»" },
          { base: "Ь", target: "Ъ", descBasePlural: "букв «Ь»", descTargetPlural: "букв «Ъ»", descBase: "букву «Ь»", descTarget: "букву «Ъ»" },
          { base: "И", target: "Й", descBasePlural: "букв «И»", descTargetPlural: "букв «Й»", descBase: "букву «И»", descTarget: "букву «Й»" },
          { base: "Е", target: "Ё", descBasePlural: "букв «Е»", descTargetPlural: "букв «Ё»", descBase: "букву «Е»", descTarget: "букву «Ё»" },
          { base: "З", target: "Э", descBasePlural: "букв «З»", descTargetPlural: "букв «Э»", descBase: "букву «З»", descTarget: "букву «Э»" },
          { base: "С", target: "О", descBasePlural: "букв «С»", descTargetPlural: "букв «О»", descBase: "букву «С»", descTarget: "букву «О»" },
          { base: "896", target: "869", descBasePlural: "чисел «896»", descTargetPlural: "чисел «869»", descBase: "число «896»", descTarget: "число «869»" },
          { base: "538", target: "583", descBasePlural: "чисел «538»", descTargetPlural: "чисел «583»", descBase: "число «538»", descTarget: "число «583»" },
          { base: "КОТ", target: "ТОК", descBasePlural: "слов «КОТ»", descTargetPlural: "слов «ТОК»", descBase: "слово «КОТ»", descTarget: "слово «ТОК»" },
          { base: "СОН", target: "НОС", descBasePlural: "слов «СОН»", descTargetPlural: "слов «НОС»", descBase: "слово «СОН»", descTarget: "слово «НОС»" }
        ];

        function generateAttentionQuestions(rng) {
          var picked = shuffleArray(rng, ATTENTION_PAIRS).slice(0, 2);
          return picked.map(function (pair) {
            var flip = rng() < 0.5;
            var commonChar = flip ? pair.target : pair.base;
            var oddChar = flip ? pair.base : pair.target;
            var descCommonPlural = flip ? pair.descTargetPlural : pair.descBasePlural;
            var descOdd = flip ? pair.descBase : pair.descTarget;

            var targetIndex = randInt(rng, 0, 24); // 5x5 grid = 25 cells
            var cells = [];
            for (var i = 0; i < 25; i++) {
              cells.push(i === targetIndex ? oddChar : commonChar);
            }

            var promptText = "Найдите " + descOdd + " среди " + descCommonPlural + " и нажмите на неё.";
            var row = Math.floor(targetIndex / 5) + 1;
            var col = (targetIndex % 5) + 1;
            
            return {
              type: "grid",
              category: "Внимание",
              prompt: promptText,
              speechSegments: [{ text: promptText, lang: "ru-RU" }],
              cells: cells,
              targetIndex: targetIndex,
              oddChar: oddChar,
              explanation: "Нужный символ «" + oddChar + "» находится в строке " + row + ", столбец " + col + "."
            };
          });
        }

        // --- Категория 3: Кругозор (35 встроенных вопросов) ---
        var TRIVIA_BANK = [
          {
            question: "Какой русский князь считается основателем Москвы?",
            options: ["Юрий Долгорукий", "Владимир Красное Солнышко", "Александр Невский"],
            answer: "Юрий Долгорукий",
            explanation: "В 1147 году Юрий Долгорукий впервые упомянул Москву в летописи, поэтому его считают основателем города."
          },
          {
            question: "Какое море в России является самым маленьким?",
            options: ["Азовское море", "Чёрное море", "Балтийское море"],
            answer: "Азовское море",
            explanation: "Азовское море — самое мелкое и маленькое море в мире, его площадь составляет около 39 тысяч квадратных километров."
          },
          {
            question: "Закончите пословицу: «Утро вечера ...»",

            var correctIdx = shuffledOpts.indexOf(item.answer);

              type: "choice",

              speechSegments: [{ text: item.question, lang: "ru-RU" }],
              options: shuffledOpts,
              correctIndex: correctIdx,

        function generateEnglishQuestions(rng) {
          var shuffledPool = shuffleArray(rng, ENGLISH_BANK);
          var picked = shuffledPool.slice(0, 2);

          return picked.map(function (wordObj) {
            var others = ENGLISH_BANK.filter(function (w) {
              return w.en !== wordObj.en;
            });
            var distractors = shuffleArray(rng, others).slice(0, 2).map(function (w) {
              return w.ru;
            });
            var options = shuffleArray(rng, [wordObj.ru, distractors[0], distractors[1]]);
            var correctIdx = options.indexOf(wordObj.ru);

            return {
              type: "english",
              category: "Базовый английский",
              englishWord: wordObj.en,
              russianMeaning: wordObj.ru,
              prompt: "Выберите правильный перевод английской фразы:",
              speechSegments: [
                { text: "Выберите правильный перевод английской фразы:", lang: "ru-RU" },
                { text: wordObj.en, lang: "en-US" }
              ],
              options: options,
              correctIndex: correctIdx,
              explanation: "Фраза «" + wordObj.en + "» переводится на русский как «" + wordObj.ru + "»."
            };
          });
        }

          var englishQs = generateEnglishQuestions(rng);
          return mathQs.concat(attentionQs, triviaQs, englishQs);

        function startWorkout() {
          stopSpeech();
          state.dateKey = getLocalDateKey();
          state.questions = buildDailyWorkout(state.dateKey);
          state.currentIndex = 0;
          state.correctCount = 0;
          state.answered = false;
          state.selectedIndex = null;
          state.isCorrect = false;
          state.speechNotice = "";
          state.screen = "quiz";
          render();
          window.scrollTo({ top: 0, behavior: "smooth" });
        }

        function goToStart() {
          stopSpeech();
          state.screen = "start";
          state.speechNotice = "";
          render();
          window.scrollTo({ top: 0, behavior: "smooth" });
        }

        function handleAnswer(choiceIndex) {
          if (state.answered) return;
          stopSpeech();
          var q = state.questions[state.currentIndex];
          var isRight = q.type === "grid" ? choiceIndex === q.targetIndex : choiceIndex === q.correctIndex;

          state.answered = true;
          state.selectedIndex = choiceIndex;
          state.isCorrect = isRight;
          state.speechNotice = "";
          if (isRight) {
            state.correctCount += 1;
          }

          render();

          var nextBtn = document.getElementById("btn-next-question");
          if (nextBtn) {
            setTimeout(function () {
              nextBtn.scrollIntoView({ behavior: "smooth", block: "nearest" });
            }, 60);
          }
        }

        function handleNextQuestion() {
          stopSpeech();
          state.speechNotice = "";
          if (state.currentIndex + 1 < state.questions.length) {
            state.currentIndex += 1;
            state.answered = false;
            state.selectedIndex = null;
            state.isCorrect = false;
            render();
            window.scrollTo({ top: 0, behavior: "smooth" });
          } else {
            recordWorkoutCompletion();
            state.screen = "complete";
            render();
            window.scrollTo({ top: 0, behavior: "smooth" });
          }
        }

                icons: [
                  { src: svgDataUrl, sizes: "any", type: "image/svg+xml", purpose: "any" },
                  { src: png192, sizes: "192x192", type: "image/png", purpose: "any" },
                  { src: png512, sizes: "512x512", type: "image/png", purpose: "any" },
                  { src: png512, sizes: "512x512", type: "image/png", purpose: "maskable" }
                ]
              };
              manifestEl.setAttribute(
                "href",
                "data:application/manifest+json;charset=utf-8," + encodeURIComponent(JSON.stringify(manifestObj))
              );
            }
          };
          img.src = svgDataUrl;
        })();

        window.addEventListener("beforeinstallprompt", function (e) {
          e.preventDefault();
          pwaState.deferredPrompt = e;
          if (state.screen === "start") render();
        });

        window.addEventListener("appinstalled", function () {
          pwaState.isInstalled = true;
          pwaState.deferredPrompt = null;
          pwaState.showIOSGuide = false;
          if (state.screen === "start") render();
        });

        function renderStartScreen() {
          var now = new Date();
          var streakInfo = getActiveStreakInfo();
          var daysWord = pluralizeDays(streakInfo.streak);

          var completedNote = streakInfo.completedToday
            ? '<p class="text-muted">Сегодняшняя зарядка уже пройдена. Вы можете пройти её ещё раз для закрепления.</p>'
            : '<p class="text-muted">Спокойная ежедневная разминка без спешки и таймеров. Задания обновляются каждый день.</p>';

          var installHtml = "";
          if (!pwaState.isInstalled) {
            if (pwaState.deferredPrompt) {
              installHtml =
                '<button type="button" class="btn-secondary" id="btn-install-pwa">Добавить приложение на экран</button>';
            } else if (pwaState.isIOS) {
              installHtml =
                '<button type="button" class="btn-secondary" id="btn-ios-guide">Добавить на экран «Домой»</button>';
              if (pwaState.showIOSGuide) {
                installHtml +=
                  '<div class="streak-box" role="status">' +
                    "<p><strong>Как сохранить на экран iPhone или iPad:</strong></p>" +
                    "<p>1. Нажмите кнопку <strong>«Поделиться»</strong> (квадрат со стрелкой вверх) внизу экрана.</p>" +
                    "<p>2. Выберите пункт <strong>«На экран «Домой»»</strong> и нажмите <strong>«Добавить»</strong>.</p>" +
                    '<button type="button" class="btn-secondary" id="btn-close-ios-guide" style="margin-top: 8px;">Понятно, закрыть</button>' +
                  "</div>";
              }
            }
          }

          appEl.innerHTML =
            '<section class="card">' +
              '<div>' +
                '<p class="meta-line">' + escapeHtml(formatRussianDate(now)) + "</p>" +
                "<h1>" + escapeHtml(getGreeting(now)) + "<br>Зарядка для ума</h1>" +
              "</div>" +
              '<div class="streak-box">' +
                '<div class="streak-number">Вы занимаетесь ' + streakInfo.streak + " " + daysWord + " подряд</div>" +
                completedNote +
              "</div>" +
              '<hr class="divider" />' +
              '<div>' +
                '<p class="meta-line" style="margin-bottom: 12px;">План на сегодня (8 заданий):</p>' +
                '<ul class="plan-list">' +
                  '<li class="plan-item"><span>Математика</span><span class="text-muted">2 задачи</span></li>' +
                  '<li class="plan-item"><span>Внимание</span><span class="text-muted">2 поиска</span></li>' +
                  '<li class="plan-item"><span>Кругозор</span><span class="text-muted">2 вопроса</span></li>' +
                  '<li class="plan-item"><span>Базовый английский</span><span class="text-muted">2 фразы</span></li>' +
                "</ul>" +
              "</div>" +
              '<div class="btn-stack">' +
                '<button type="button" class="btn-primary" id="btn-start-workout">Начать тренировку</button>' +
                installHtml +
              "</div>" +
            "</section>";

          var installBtn = document.getElementById("btn-install-pwa");
          if (installBtn) {
            installBtn.addEventListener("click", function () {
              if (!pwaState.deferredPrompt) return;
              pwaState.deferredPrompt.prompt();
              pwaState.deferredPrompt.userChoice.then(function (choiceResult) {
                if (choiceResult && choiceResult.outcome === "accepted") {
                  pwaState.isInstalled = true;
                }
                pwaState.deferredPrompt = null;
                render();
              });
            });
          }

          var iosGuideBtn = document.getElementById("btn-ios-guide");
          if (iosGuideBtn) {
            iosGuideBtn.addEventListener("click", function () {
              pwaState.showIOSGuide = !pwaState.showIOSGuide;
              render();
            });
          }

          var closeIosBtn = document.getElementById("btn-close-ios-guide");
          if (closeIosBtn) {
            closeIosBtn.addEventListener("click", function () {
              pwaState.showIOSGuide = false;
              render();
            });
          }

          document.getElementById("btn-start-workout").addEventListener("click", startWorkout);
        }

        function renderQuizScreen() {
          var total = state.questions.length;
          var idx = state.currentIndex;
          var q = state.questions[idx];
          var progressPct = Math.round(((idx + (state.answered ? 1 : 0)) / total) * 100);

          var englishBoxHtml = "";
          if (q.type === "english") {
            englishBoxHtml =
              '<div class="english-word-box">' +
                '<div class="english-word-text" lang="en">' + escapeHtml(q.englishWord) + "</div>" +
                '<button type="button" class="btn-voice" id="btn-speak-english">' +
                  ICON_SPEAKER +
                  "<span>Послушать фразу на английском</span>" +
                "</button>" +
              "</div>";
          }

          var interactiveHtml = "";
          if (q.type === "grid") {
            var cellsHtml = "";
            for (var c = 0; c < q.cells.length; c++) {
              var cls = "grid-cell";
              var ariaSuffix = "";
              if (state.answered) {
                if (c === q.targetIndex) {
                  cls += " is-correct";
                  ariaSuffix = " — правильный символ";
                } else if (c === state.selectedIndex) {
                  cls += " is-wrong";
                  ariaSuffix = " — неверный выбор";
                } else {
                  cls += " is-dimmed";
                }
              }
              cellsHtml +=
                '<button type="button" class="' + cls + '" data-choice="' + c + '" ' +
                (state.answered ? "disabled" : "") +
                ' aria-label="Символ ' + escapeHtml(q.cells[c]) + ariaSuffix + '">' +
                escapeHtml(q.cells[c]) +
                "</button>";
            }
            interactiveHtml = '<div class="attention-grid" role="group" aria-label="Сетка символов 5 на 5">' + cellsHtml + "</div>";
          } else {
            var optionsHtml = "";
            for (var o = 0; o < q.options.length; o++) {
              var optCls = "btn-option";
              var marker = (o + 1) + ".";
              if (state.answered) {
                if (o === q.correctIndex) {
                  optCls += " is-correct";
                  marker = "✓";
                } else if (o === state.selectedIndex) {
                  optCls += " is-wrong";
                  marker = "✕";
                } else {
                  optCls += " is-dimmed";
                }
              }
              optionsHtml +=
                '<button type="button" class="' + optCls + '" data-choice="' + o + '" ' +
                (state.answered ? "disabled" : "") +
                ">" +
                '<span class="option-marker" aria-hidden="true">' + marker + "</span>" +
                "<span>" + escapeHtml(q.options[o]) + "</span>" +
                "</button>";
            }
            interactiveHtml = '<div class="btn-stack" role="group" aria-label="Варианты ответа">' + optionsHtml + "</div>";
          }

          var feedbackHtml = "";
          if (state.answered) {
            var fbClass = state.isCorrect ? "feedback-box is-correct" : "feedback-box is-wrong";
            var fbTitle = state.isCorrect
              ? "✓ Отлично! Верный ответ."
              : "✕ Не совсем так — ничего страшного!";
            var fbNote = state.isCorrect
              ? q.explanation
              : "Правильный ответ отмечен зелёным цветом. " + q.explanation;
            var nextLabel = idx + 1 < total ? "Следующий вопрос" : "Завершить тренировку";

            feedbackHtml =
              '<div class="' + fbClass + '" role="status">' +
                '<div class="feedback-title">' + escapeHtml(fbTitle) + "</div>" +
                '<p class="feedback-note">' + escapeHtml(fbNote) + "</p>" +
              "</div>" +
              '<div class="btn-stack">' +
                '<button type="button" class="btn-primary" id="btn-next-question">' + nextLabel + "</button>" +
              "</div>";
          }

          var speechNoticeHtml = state.speechNotice
            ? '<p class="text-muted" role="status">' + escapeHtml(state.speechNotice) + "</p>"
            : "";

          appEl.innerHTML =
            '<section class="card">' +
              '<div class="progress-header">' +
                '<div class="meta-line">Вопрос ' + (idx + 1) + " из " + total + " · " + escapeHtml(q.category) + "</div>" +
                '<div class="progress-track" aria-hidden="true">' +
                  '<div class="progress-fill" style="width: ' + progressPct + '%"></div>' +
                "</div>" +
              "</div>" +
              '<button type="button" class="btn-voice" id="btn-read-aloud">' +
                ICON_SPEAKER +
                "<span>Озвучить вопрос</span>" +
              "</button>" +
              speechNoticeHtml +
              "<h2>" + escapeHtml(q.prompt) + "</h2>" +
              englishBoxHtml +
              interactiveHtml +
              feedbackHtml +
            "</section>" +
            '<div class="btn-stack">' +
              '<button type="button" class="btn-secondary" id="btn-back-home">Вернуться на главную</button>' +
            "</div>";

          document.getElementById("btn-read-aloud").addEventListener("click", function () {
            if (!("speechSynthesis" in window)) {
              state.speechNotice = "К сожалению, в этом браузере озвучивание не поддерживается.";
              render();
              return;
            }
            state.speechNotice = "";
            speakSequence(q.speechSegments);
          });

          var speakEngBtn = document.getElementById("btn-speak-english");
          if (speakEngBtn) {
            speakEngBtn.addEventListener("click", function () {
              if (!("speechSynthesis" in window)) {
                state.speechNotice = "К сожалению, в этом браузере озвучивание не поддерживается.";
                render();
                return;
              }
              state.speechNotice = "";
              speakSequence([{ text: q.englishWord, lang: "en-US" }]);
            });
          }

          var choiceButtons = appEl.querySelectorAll("[data-choice]");
          for (var i = 0; i < choiceButtons.length; i++) {
            choiceButtons[i].addEventListener("click", function (ev) {
              var chosen = parseInt(ev.currentTarget.getAttribute("data-choice"), 10);
              handleAnswer(chosen);
            });
          }

          var nextBtn = document.getElementById("btn-next-question");
          if (nextBtn) {
            nextBtn.addEventListener("click", handleNextQuestion);
          }

          document.getElementById("btn-back-home").addEventListener("click", goToStart);
        }

        function clearConfetti() {
          var existing = document.getElementById("confetti-layer");
          if (existing && existing.parentNode) {
            existing.parentNode.removeChild(existing);
          }
        }

        function launchConfetti() {
          clearConfetti();
          var layer = document.createElement("div");
          layer.id = "confetti-layer";
          layer.className = "confetti-layer";
          layer.setAttribute("aria-hidden", "true");

          var colors = ["#1B6B3A", "#D97706", "#2B5B9E", "#C2412D", "#EAB308"];
          var count = 34;

          for (var i = 0; i < count; i++) {
            var piece = document.createElement("span");
            piece.className = "confetti-piece";
            var leftPct = ((i * 29 + 7) % 96) + 2;
            var delaySec = ((i % 7) * 0.22).toFixed(2);
            var durSec = (3.4 + (i % 5) * 0.35).toFixed(2);
            var driftPx = ((i % 2 === 0 ? 1 : -1) * (18 + (i % 4) * 14)) + "px";
            var rotDeg = ((i % 2 === 0 ? 1 : -1) * (360 + (i % 3) * 180)) + "deg";

            piece.style.left = leftPct + "%";
            piece.style.backgroundColor = colors[i % colors.length];
            piece.style.setProperty("--delay", delaySec + "s");
            piece.style.setProperty("--dur", durSec + "s");
            piece.style.setProperty("--drift", driftPx);
            piece.style.setProperty("--rot", rotDeg);
            if (i % 3 === 0) {
              piece.style.width = "10px";
              piece.style.height = "10px";
              piece.style.borderRadius = "50%";
            }

            layer.appendChild(piece);
          }

          document.body.appendChild(layer);
        }

        function renderCompleteScreen() {
          var streakInfo = getActiveStreakInfo();
          var daysWord = pluralizeDays(streakInfo.streak);
          var total = state.questions.length;

          appEl.innerHTML =
            '<section class="card">' +
              '<div class="celebration-banner">' +
                "<h2>Зарядка завершена!</h2>" +
                "<p>Вы сегодня отлично потренировали память, внимание и мышление.</p>" +
              "</div>" +
              '<div class="streak-box">' +
                '<div class="streak-number">Вы занимаетесь ' + streakInfo.streak + " " + daysWord + " подряд</div>" +
                "<p>Верных ответов сегодня: <strong>" + state.correctCount + " из " + total + "</strong>.</p>" +
              "</div>" +
              "<p>Возвращайтесь завтра за новыми заданиями. Регулярные небольшие тренировки помогают сохранять ясность ума и бодрость!</p>" +
              '<div class="btn-stack">' +
                '<button type="button" class="btn-primary" id="btn-finish-home">Вернуться на главную</button>' +
                '<button type="button" class="btn-secondary" id="btn-repeat-workout">Пройти ещё раз</button>' +
              "</div>" +
            "</section>";

          launchConfetti();

          document.getElementById("btn-finish-home").addEventListener("click", goToStart);
          document.getElementById("btn-repeat-workout").addEventListener("click", startWorkout);
        }

        function render() {
          if (state.screen === "start") {
            clearConfetti();
            renderStartScreen();
          } else if (state.screen === "quiz") {
            clearConfetti();
            renderQuizScreen();
          } else {
            renderCompleteScreen();
          }
        }

        render();
      })();
    </script>
  </body>
</html>
